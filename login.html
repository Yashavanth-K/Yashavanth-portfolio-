<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKNG Degree College - Login</title>
<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  min-height: 100vh;
}



#login-toggle {
  display: none;
}

.login-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


.login-box {
  width: 350px;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
  text-align: center;
}



.login-box h1 {
  margin-bottom: 10px;
}


.login-box p {
  color: #666;
  margin-bottom: 25px;
}


.login-box form label {
  display: block;
  text-align: left;
  font-weight: bold;
  margin-bottom: 7px;
}


.login-box input[type="text"],
.login-box input[type="password"] {
  width: 100%;
 padding: 12px;
 margin-bottom: 18px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

.login-box input:focus {
  outline: none;
  border-color: #007bff;
}


.login-button {
  display: block !important;
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  text-align: center !important;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.login-button:hover {
  background: #0056b3;
}


.welcome-page {
  display: none;
  min-height: 100vh;
  justify-content: center;
  align-items: center;
  text-align: center;
}


.welcome-box {
  width: 500px;
  background: white;
  padding: 45px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}


.welcome-box h1 {
  margin-bottom: 20px;
}



.welcome-box h2 {
  margin-bottom: 10px;
}



.welcome-box h3 {
  margin-bottom: 20px;
}


.welcome-box p {
  color: #666;

  margin-bottom: 30px;
}

.logout-button {
  display: inline-block;
  padding: 12px 30px;
  background: #dc3545;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}


.logout-button:hover {
  background: #b02a37;
}

#login-toggle:checked ~ .login-page {
  display: none;
}


#login-toggle:checked ~ .welcome-page {
  display: flex;
}
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 12px;
  background-color: #007bff;
  color: white;
  text-align: center;
  font-size: 14px;
}
</style>
</head>

<body>

  <input type="checkbox" id="login-toggle">

  <div class="login-page">

    <div class="login-box">

      <h1>🔐 Login</h1>

      <p>Welcome! Please login to continue.</p>

      <form>

        <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" required>

        <label for="password">Password</label>

        <input type="password" id="password" placeholder="Enter your password" required>
        
        <label for="login-toggle" class="login-button">
          Login
        </label>

      </form>

    </div>

  </div>


  <div class="welcome-page">

    <div class="welcome-box">

      <h1>🎓 Welcome!</h1>

      <h2>SKNG DEGREE COLLEGE</h2>

      <h3>GANGAVATHI</h3>

      <p>You have successfully logged in.</p>

      <label for="login-toggle" class="logout-button">
        Logout
      </label>

    </div>

  </div>
<footer class="footer">
  <p>© 2026 SKNG Degree College | Created by K Yashavanth</p>
</footer>
</body>
</html>
